<!DOCTYPE html>
<html lang="zh-CN" data-theme="light" data-surface="solid">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Antigravity × Codex</title>
<style>
:root, :root[data-theme="light"] {
    --bg: #FAF9F6;
    --bg-fx: none;
    --sidebar: #F4F2EC;
    --surface: #FFFFFF;
    --surface-soft: #F6F4EE;
    --bubble-ag: #EFECE3;
    --border: #E8E4DA;
    --specular: transparent;
    --blur: 0px;
    --text: #2B2A27;
    --muted: #847F75;
    --accent: #C96442;
    --code-bg: #F0EDE5;
    --pill-edit-bg: #EAEFFC;
    --pill-edit-fg: #4A66C2;
    --pill-pass-bg: #E5F4EC;
    --pill-pass-fg: #2D8659;
    --pill-fail-bg: #FDECEB;
    --pill-fail-fg: #C9403A;
    --diff-add-bg: #EAF7EE;
    --diff-add-fg: #1F6E43;
    --diff-del-bg: #FCECEB;
    --diff-del-fg: #B83732;
    --shadow: 0 1px 3px rgba(30, 24, 15, 0.04);
  }
  :root[data-theme="dark"] {
    --bg: #161614;
    --bg-fx: none;
    --sidebar: #1D1C19;
    --surface: #22211E;
    --surface-soft: #1B1A17;
    --bubble-ag: #2C2A24;
    --border: #33312B;
    --specular: transparent;
    --blur: 0px;
    --text: #EFECE6;
    --muted: #9D978C;
    --accent: #D97757;
    --code-bg: #2D2B26;
    --pill-edit-bg: #262E45;
    --pill-edit-fg: #8BA8F8;
    --pill-pass-bg: #1D3428;
    --pill-pass-fg: #5CC88B;
    --pill-fail-bg: #3C2020;
    --pill-fail-fg: #F0716C;
    --diff-add-bg: #1A3123;
    --diff-add-fg: #7CE3A1;
    --diff-del-bg: #3A1E1E;
    --diff-del-fg: #F6918B;
    --shadow: 0 2px 8px rgba(0, 0, 0, 0.28);
  }

  /* Surface: Frosted (轻柔磨砂) */
  :root[data-theme="light"][data-surface="frosted"] {
    --bg: #F6F4EF;
    --bg-fx: radial-gradient(circle at 15% 15%, rgba(236, 198, 174, 0.28), transparent 46%),
             radial-gradient(circle at 86% 24%, rgba(186, 204, 244, 0.25), transparent 44%),
             radial-gradient(circle at 60% 88%, rgba(196, 232, 212, 0.24), transparent 48%);
    --sidebar: rgba(246, 244, 239, 0.72);
    --surface: rgba(255, 255, 255, 0.74);
    --surface-soft: rgba(247, 245, 240, 0.66);
    --bubble-ag: rgba(239, 235, 226, 0.78);
    --border: rgba(210, 202, 188, 0.65);
    --blur: 14px;
  }
  :root[data-theme="dark"][data-surface="frosted"] {
    --bg: #141517;
    --bg-fx: radial-gradient(circle at 18% 12%, rgba(92, 128, 224, 0.16), transparent 46%),
             radial-gradient(circle at 82% 28%, rgba(217, 119, 87, 0.14), transparent 45%),
             radial-gradient(circle at 55% 90%, rgba(72, 174, 130, 0.12), transparent 50%);
    --sidebar: rgba(26, 27, 30, 0.72);
    --surface: rgba(34, 35, 39, 0.72);
    --surface-soft: rgba(28, 29, 33, 0.66);
    --bubble-ag: rgba(46, 44, 39, 0.76);
    --border: rgba(255, 255, 255, 0.09);
    --blur: 14px;
  }

  /* Surface: Liquid Glass (液态玻璃) */
  :root[data-theme="light"][data-surface="glass"] {
    --bg: #F3F5FA;
    --bg-fx: radial-gradient(circle at 12% 10%, rgba(255, 194, 168, 0.45), transparent 42%),
             radial-gradient(circle at 88% 18%, rgba(162, 198, 255, 0.44), transparent 44%),
             radial-gradient(circle at 46% 85%, rgba(168, 236, 212, 0.38), transparent 46%);
    --sidebar: rgba(255, 255, 255, 0.46);
    --surface: rgba(255, 255, 255, 0.56);
    --surface-soft: rgba(255, 255, 255, 0.42);
    --bubble-ag: rgba(246, 240, 232, 0.64);
    --border: rgba(255, 255, 255, 0.75);
    --specular: inset 0 1px 0 rgba(255, 255, 255, 0.85), 0 8px 24px rgba(31, 45, 74, 0.06);
    --blur: 22px;
  }
  :root[data-theme="dark"][data-surface="glass"] {
    --bg: #0E1117;
    --bg-fx: radial-gradient(circle at 15% 14%, rgba(79, 141, 247, 0.28), transparent 45%),
             radial-gradient(circle at 86% 22%, rgba(217, 119, 87, 0.24), transparent 44%),
             radial-gradient(circle at 52% 88%, rgba(63, 185, 140, 0.22), transparent 48%);
    --sidebar: rgba(24, 28, 36, 0.52);
    --surface: rgba(30, 34, 44, 0.56);
    --surface-soft: rgba(22, 26, 34, 0.48);
    --bubble-ag: rgba(48, 44, 42, 0.62);
    --border: rgba(255, 255, 255, 0.14);
    --specular: inset 0 1px 0 rgba(255, 255, 255, 0.16), 0 10px 28px rgba(0, 0, 0, 0.34);
    --blur: 22px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background-color: var(--bg);
    background-image: var(--bg-fx);
    background-attachment: fixed;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 13.5px;
    line-height: 1.6;
    overflow: hidden;
  }
  .muted { color: var(--muted); }

  .glass-surface {
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    box-shadow: var(--specular, var(--shadow));
  }

  .shell { display: flex; height: 100vh; width: 100%; }
  .shell.hide-side .sidebar { display: none; }

  /* Left sidebar */
  .sidebar {
    width: 248px;
    flex-shrink: 0;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    display: flex;
    flex-direction: column;
    padding: 14px 12px;
    gap: 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 2px 4px; }
  .brand-icon {
    display: inline-flex; align-items: center; gap: 3px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px;
  }
  .brand-title { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
  .brand-sub { font-size: 11px; color: var(--muted); }

  .search-wrap { position: relative; display: flex; align-items: center; }
  .search-ic { position: absolute; left: 10px; color: var(--muted); display: inline-flex; pointer-events: none; }
  .search {
    width: 100%; background: var(--surface); color: var(--text);
    border: 1px solid var(--border); border-radius: 9px; padding: 7px 10px 7px 30px; font-size: 12.5px; outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .side-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  .proj-head {
    display: flex; align-items: center; gap: 6px; padding: 5px 6px; border-radius: 8px;
    font-size: 12.5px; font-weight: 600; color: var(--text); cursor: pointer; list-style: none;
  }
  .proj-head::-webkit-details-marker { display: none; }
  .proj-head:hover { background: var(--surface-soft); }
  .proj-head::before {
    content: ""; width: 6px; height: 6px; flex-shrink: 0;
    border: solid var(--muted); border-width: 0 1.5px 1.5px 0; transform: rotate(-45deg);
  }
  .proj-group[open] > .proj-head::before { transform: rotate(45deg); }
  .proj-name { display: flex; align-items: center; gap: 6px; min-width: 0; overflow-wrap: anywhere; }
  .proj-name svg { flex-shrink: 0; }
  .proj-cnt { margin-left: auto; flex-shrink: 0; font-size: 11px; font-weight: 400; color: var(--muted); }
  .sess-list { display: flex; flex-direction: column; gap: 5px; margin-top: 4px; }
  .sess-card {
    text-align: left; width: 100%; background: transparent; border: 1px solid transparent;
    border-radius: 10px; padding: 8px 10px; cursor: pointer; color: var(--text); transition: 0.15s;
  }
  .sess-card:hover { background: rgba(128,128,128,0.06); }
  .sess-card.active { background: var(--surface); border-color: var(--border); box-shadow: var(--shadow); }
  .sess-title {
    display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2;
    overflow: hidden; overflow-wrap: anywhere; font-size: 12.5px; font-weight: 600; line-height: 1.4;
  }
  .sess-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 11px; color: var(--muted); margin-top: 5px; }
  .sess-status { padding: 1px 6px; border-radius: 999px; background: var(--code-bg); color: var(--text); }
  .sess-status[data-status="running"], .sess-status[data-status="reviewing"] { background: var(--pill-edit-bg); color: var(--pill-edit-fg); }
  .sess-status[data-status="done"] { background: var(--pill-pass-bg); color: var(--pill-pass-fg); }
  .sess-status[data-status="failed"], .sess-status[data-status="blocked"] { background: var(--pill-fail-bg); color: var(--pill-fail-fg); }
  .empty-side { font-size: 12px; color: var(--muted); padding: 12px 6px; }

  /* Right main */
  .main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
  .header {
    padding: 11px 20px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar);
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-shrink: 0;
    z-index: 15;
  }
  .header-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .header-title { font-size: 15px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .header-sub-row { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
  .header-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; font-size: 12px; color: var(--muted); }
  #headerSubText { overflow-wrap: anywhere; }

  /* Cache pill + hover popover */
  .cache-wrap { position: relative; display: inline-flex; }
  .cache-pill {
    background: var(--pill-pass-bg); color: var(--pill-pass-fg);
    padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; cursor: default;
  }
  .cache-pop {
    display: none; position: absolute; left: 0; top: 24px; min-width: 210px; z-index: 40;
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 9px 11px; box-shadow: 0 10px 26px rgba(0,0,0,0.14);
    backdrop-filter: blur(18px);
  }
  .cache-wrap:hover .cache-pop { display: flex; flex-direction: column; gap: 5px; }
  .pop-row { display: flex; justify-content: space-between; gap: 12px; font-size: 11.5px; color: var(--muted); }
  .pop-row strong { color: var(--text); font-weight: 600; }

  .pill-btn {
    background: var(--surface); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 3px 8px; cursor: pointer; font-size: 11.5px; font-weight: 600;
  }
  .pill-btn:hover { border-color: var(--accent); color: var(--accent); }
  .icon-btn {
    background: transparent; border: 1px solid transparent; color: var(--muted);
    border-radius: 7px; padding: 4px 7px; cursor: pointer; font-size: 14px;
  }
  .icon-btn:hover { background: var(--surface-soft); color: var(--text); }

  .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #2EA043; margin-right: 5px; }
  .live-dot.pulse { animation: pulse 1.4s infinite; }
  .idle-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--muted); margin-right: 5px; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.35; transform: scale(0.8); } }

  .switch-label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px; color: var(--text); }
  .switch-label input { display: none; }
  .slider { width: 30px; height: 17px; border-radius: 999px; background: var(--border); position: relative; transition: 0.2s; }
  .slider::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #fff; transition: 0.2s; }
  .switch-label input:checked + .slider { background: var(--accent); }
  .switch-label input:checked + .slider::after { transform: translateX(13px); }

  /* Feed */
  .feed {
    flex: 1; overflow-y: auto; padding: 24px 28px 80px;
    display: flex; flex-direction: column; gap: 22px;
    max-width: 920px; width: 100%; margin: 0 auto;
  }
  .empty-main { color: var(--muted); text-align: center; margin-top: 80px; font-size: 13px; }
  .fade-in { animation: rise 0.18s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

  .round-divider {
    display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 11.5px; margin: 4px 0;
  }
  .round-divider::before, .round-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

  .turn-block { display: flex; flex-direction: column; gap: 16px; }

  /* Antigravity bubble */
  .ag-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .ag-meta { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .round-pill { background: var(--code-bg); color: var(--text); padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .avatar {
    width: 26px; height: 26px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface); border: 1px solid var(--border);
  }
  .ag-bubble {
    position: relative;
    max-width: 78%;
    background: var(--bubble-ag);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 13px 16px;
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    box-shadow: var(--specular, var(--shadow));
  }
  .ag-text {
    font-family: Georgia, "Noto Serif SC", "Songti SC", serif;
    font-size: 14px; line-height: 1.65;
  }
  .ag-bubble.clamped .ag-text {
    max-height: 112px; overflow: hidden;
    -webkit-mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
    mask-image: linear-gradient(180deg, #000 62%, transparent 100%);
  }
  .expand-btn {
    margin-top: 6px; background: transparent; border: none; color: var(--accent);
    cursor: pointer; font-size: 12px; font-weight: 600; padding: 0;
  }
  .ic { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12.5px; background: var(--code-bg); padding: 1px 6px; border-radius: 5px; }
  .markdown { overflow-wrap: anywhere; }
  .markdown > * { margin: 0 0 0.65em; }
  .markdown > :last-child { margin-bottom: 0; }
  .markdown :is(h1, h2, h3, h4, h5, h6) { line-height: 1.3; }
  .markdown h1 { font-size: 1.35em; }
  .markdown h2 { font-size: 1.2em; }
  .markdown :is(h3, h4, h5, h6) { font-size: 1.05em; }
  .markdown :is(ul, ol) { padding-inline-start: 1.5em; }
  .markdown a { color: var(--accent); }
  .markdown pre, .cmd-output {
    overflow: auto;
    background: var(--code-bg);
    padding: 8px 10px;
    border-radius: 7px;
    font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
    overflow-wrap: normal;
  }
  .markdown pre code, .cmd-output code { font: inherit; }

  /* Codex response */
  .cx-wrap { display: flex; flex-direction: column; gap: 10px; max-width: 88%; }
  .cx-meta { display: flex; align-items: center; gap: 8px; font-size: 13px; }

  .exec-card {
    background: var(--surface-soft);
    border: 1px solid var(--border);
    border-radius: 13px;
    overflow: hidden;
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    box-shadow: var(--specular, var(--shadow));
  }
  .exec-summary {
    list-style: none; cursor: pointer; padding: 10px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    font-size: 12.5px; font-weight: 500; color: var(--text);
  }
  .exec-summary::-webkit-details-marker { display: none; }
  .disclosure {
    width: 6px; height: 6px; flex: 0 0 6px; margin: 0 3px;
    border: solid var(--muted); border-width: 0 1px 1px 0; transform: rotate(-45deg);
  }
  details[open] > summary .disclosure { transform: rotate(45deg); }
  .star { display: inline-block; color: var(--accent); margin-right: 4px; }
  .star.spin { animation: slowspin 3.2s linear infinite; }
  @keyframes slowspin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
  .exec-inner { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }

  .thought-box {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 10px 12px; font-size: 12.5px; color: var(--muted);
    display: flex; align-items: flex-start; gap: 8px; white-space: pre-wrap; overflow-wrap: anywhere;
  }
  .t-ic { flex-shrink: 0; margin-top: 2px; opacity: 0.75; display: inline-flex; }
  .exec-row {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
    padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .exec-left { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; }
  .pill-edit { background: var(--pill-edit-bg); color: var(--pill-edit-fg); padding: 1px 7px; border-radius: 5px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .mono-path, .mono-cmd { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .link-btn { background: transparent; border: none; color: var(--muted); cursor: pointer; font-size: 12px; flex-shrink: 0; }
  .link-btn:hover { color: var(--accent); }
  .cmd-pill { padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; flex-shrink: 0; }
  .cmd-pass { background: var(--pill-pass-bg); color: var(--pill-pass-fg); }
  .cmd-fail { background: var(--pill-fail-bg); color: var(--pill-fail-fg); }
  .cmd-run { background: var(--code-bg); color: var(--accent); }
  .cmd-details {
    background: var(--surface); border: 1px solid var(--border); border-radius: 9px;
  }
  .cmd-summary { cursor: pointer; list-style: none; background: transparent; border: 0; }
  .cmd-summary::-webkit-details-marker { display: none; }
  .cmd-summary:hover .disclosure { border-color: var(--accent); }
  .mono-cmd { margin-right: auto; }
  .cmd-output { margin: 0 8px 8px; max-height: 240px; }

  /* Review-grade inline Diff */
  .inline-diff {
    background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
  }
  .diff-bar {
    display: flex; justify-content: space-between; align-items: center; padding: 6px 10px;
    background: var(--surface-soft); border-bottom: 1px solid var(--border); font-size: 11.5px;
  }
  .diff-stats { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .stat-add { color: var(--diff-add-fg); font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
  .stat-del { color: var(--diff-del-fg); font-weight: 700; font-family: ui-monospace, Consolas, monospace; }
  .copy-btn {
    display: inline-flex; align-items: center; gap: 4px; background: transparent; border: 1px solid var(--border);
    color: var(--muted); border-radius: 6px; padding: 2px 7px; cursor: pointer; font-size: 11px;
  }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }
  .diff-scroll { max-height: 280px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; }
  .drow { display: grid; grid-template-columns: 36px 36px 1fr; line-height: 1.5; border-left: 2px solid transparent; }
  .drow.add { background: var(--diff-add-bg); color: var(--diff-add-fg); border-left-color: var(--pill-pass-fg); }
  .drow.del { background: var(--diff-del-bg); color: var(--diff-del-fg); border-left-color: var(--pill-fail-fg); }
  .drow.hunk { background: var(--surface-soft); color: var(--pill-edit-fg); font-weight: 600; }
  .ln { text-align: right; padding: 0 6px; color: var(--muted); opacity: 0.65; user-select: none; font-size: 10.5px; }
  .dc { white-space: pre; padding: 0 8px; }

  .summary-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 13px;
    padding: 14px 16px; display: flex; flex-direction: column; gap: 10px;
    backdrop-filter: blur(var(--blur)) saturate(140%);
    -webkit-backdrop-filter: blur(var(--blur)) saturate(140%);
    box-shadow: var(--specular, var(--shadow));
  }
  .summary-text { font-family: Georgia, "Noto Serif SC", "Songti SC", serif; font-size: 14px; line-height: 1.7; }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .file-chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--surface-soft); border: 1px solid var(--border); border-radius: 6px;
    padding: 2px 8px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11.5px; color: var(--muted);
    max-width: 100%; overflow-wrap: anywhere;
  }
  .file-chip svg { flex-shrink: 0; }

  /* Subtle floating bottom-right control dock */
  .dock {
    position: absolute; right: 20px; bottom: 16px; z-index: 25;
    display: flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 5px 8px; opacity: 0.45; transition: opacity 0.2s, box-shadow 0.2s;
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    box-shadow: 0 6px 20px rgba(0,0,0,0.08);
  }
  .dock:hover, .dock:focus-within { opacity: 1; box-shadow: 0 8px 26px rgba(0,0,0,0.14); }
  .dock input {
    width: 150px; transition: width 0.2s; border: none; background: transparent;
    color: var(--text); font-size: 12px; outline: none; padding: 2px 6px;
  }
  .dock:focus-within input { width: 230px; }
  .dock-btn {
    border: 1px solid var(--border); background: var(--surface-soft); color: var(--text);
    border-radius: 999px; padding: 3px 10px; font-size: 11.5px; font-weight: 600; cursor: pointer;
  }
  .dock-btn.warn { color: var(--accent); border-color: rgba(201,100,66,0.35); }
  .dock-btn.ok { color: var(--pill-pass-fg); border-color: rgba(45,134,89,0.35); }
  .dock-btn.send { background: var(--accent); color: #fff; border-color: var(--accent); }

  .toast {
    position: fixed; right: 22px; bottom: 64px; background: var(--text); color: var(--bg);
    padding: 6px 12px; border-radius: 8px; font-size: 12px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 60;
  }
  .toast.show { opacity: 0.94; }

  @media (max-width: 720px) {
    .shell {
      display: grid; position: relative;
      grid-template: "header" auto "feed" minmax(0, 1fr) / minmax(0, 1fr);
    }
    .main { display: contents; }
    .sidebar {
      grid-area: feed; position: absolute; inset: 0 auto 0 0; z-index: 30;
      max-width: 100%; box-shadow: 4px 0 24px rgba(0,0,0,0.16);
    }
    .header { grid-area: header; flex-wrap: wrap; gap: 4px 10px; padding: 7px 10px; }
    .header-left { flex: 1 1 100%; }
    .header-left > div { flex: 1; }
    .header-sub-row { flex-wrap: nowrap; }
    #headerSubText { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cache-wrap { flex-shrink: 0; }
    .cache-pop { left: auto; right: 0; }
    .header-right { flex-wrap: wrap; }
    .feed { grid-area: feed; padding: 14px 12px 64px; gap: 16px; }
    .ag-bubble, .cx-wrap { max-width: 100%; }
    .ag-meta { flex-wrap: wrap; justify-content: flex-end; }
    .ag-bubble, .summary-card { padding: 10px 12px; }
    .exec-summary, .exec-row { padding: 8px 10px; }
    .exec-inner { padding: 0 8px 8px; }
    .dock { right: 10px; bottom: 10px; max-width: calc(100% - 20px); }
    .dock input, .dock:focus-within input { min-width: 0; }
    .dock-btn { flex-shrink: 0; }
  }

</style>
</head>
<body>
<div id="appShell" class="shell">
  <aside class="sidebar">
    <div class="brand">
      <div id="brandIcon" class="brand-icon"></div>
      <div>
        <div class="brand-title">Antigravity × Codex</div>
        <div class="brand-sub">单向实时监控</div>
      </div>
    </div>
    <div class="search-wrap">
      <span id="searchIcon" class="search-ic"></span>
      <input id="searchInput" class="search" type="text" placeholder="搜索对话..." />
    </div>
    <div id="sidebarList" class="side-list"></div>
  </aside>

  <main class="main">
    <header class="header">
      <div class="header-left">
        <button id="toggleSidebarBtn" class="icon-btn" title="展开/收起侧栏">☰</button>
        <div style="min-width:0;">
          <div id="headerTitle" class="header-title">Antigravity × Codex</div>
          <div class="header-sub-row">
            <span id="headerSubText">正在读取本地只读状态...</span>
            <span class="cache-wrap">
              <span id="cachePill" class="cache-pill">0% 缓存</span>
              <div id="cachePopover" class="cache-pop"></div>
            </span>
          </div>
        </div>
      </div>
      <div class="header-right">
        <span id="liveStatusText"></span>
        <label class="switch-label">
          <input id="followToggle" type="checkbox" checked />
          <span class="slider"></span>
          <span>自动跟随</span>
        </label>
        <button id="surfaceBtn" class="pill-btn" title="切换表面材质：纯净 / 磨砂 / 液态玻璃">纯净</button>
        <button id="themeBtn" class="pill-btn" title="切换明暗：自动 / 浅色 / 深色">自动</button>
        <button id="refreshBtn" class="icon-btn" title="立即刷新">↻</button>
      </div>
    </header>

    <div id="chatFeed" class="feed"></div>

    <div class="dock">
      <button id="dockPauseBtn" class="dock-btn warn">暂停下一步</button>
      <input id="dockNoteInput" type="text" placeholder="叮嘱 AI 一句话..." />
      <button id="dockSendBtn" class="dock-btn send">发送</button>
    </div>
  </main>
</div>

<div id="toast" class="toast"></div>
